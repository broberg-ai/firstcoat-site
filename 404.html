<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-400-italic-latin.woff2) format("woff2")}
:root{--night:#140A1F;--white:#F6F2EC;--pink:#FF2D95;--purple:#9B3DFF;--classic:#FF3B1F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--white);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(14px,3vh,32px);padding:clamp(56px,8vh,96px) 16px}
h1{margin:0;width:min(100%,1100px,calc((100dvh - 300px) * 3))}
h1 svg{width:100%;height:auto;display:block}
.soon{margin:0;font-weight:600;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;font-size:clamp(14px,2.2vw,26px);color:var(--classic);text-shadow:0 0 14px color-mix(in srgb,var(--classic) 70%,transparent)}
.line{margin:0;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:clamp(22px,3.4vw,44px);color:color-mix(in srgb,var(--white) 82%,var(--night))}
.about{margin:clamp(8px,2vh,20px) 0 0;max-width:56ch;font-size:clamp(14px,1.4vw,17px);line-height:1.6;color:color-mix(in srgb,var(--white) 62%,var(--night))}
.sound{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:12px;border:1px solid color-mix(in srgb,var(--white) 18%,transparent);background:color-mix(in srgb,var(--white) 5%,transparent);color:var(--white);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.sound:hover{background:color-mix(in srgb,var(--pink) 18%,transparent)}
.sound:active{transform:scale(.94)}
.sound:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.sound[aria-pressed="true"]{color:var(--pink);border-color:var(--pink)}
.sound[aria-busy="true"]{opacity:.6;cursor:progress}
.sound svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.neon .tilt{animation:flicker 5s infinite}
.neon .blink{animation:flicker-2 7s infinite}
@keyframes flicker{0%,62%,64%,66%,100%{opacity:1}63%{opacity:.25}65%{opacity:.55}80%{opacity:.9}81%{opacity:.2}82%{opacity:1}}
@keyframes flicker-2{0%,30%,33%,100%{opacity:1}31%{opacity:.15}32%{opacity:.7}70%{opacity:1}71%{opacity:.3}73%{opacity:1}}
.sound-on .neon .tilt,.sound-on .neon .blink{animation:none}
@media (prefers-reduced-motion:reduce){.neon .tilt,.neon .blink{animation:none}}
</style>

<script>
// Lyden er slukket til den besøgende selv tænder den. Mens den spiller, blinker A og R præcis
// på lydens knald: hvert billede spørger lyden hvor den er, så intet kan glide.
(function(){
  var PEAKS=[{"t":1.04,"l":"A"},{"t":1.64,"l":"R"},{"t":4.14,"l":"A"},{"t":4.72,"l":"R"},{"t":7.64,"l":"A"},{"t":8.08,"l":"R"},{"t":8.84,"l":"A"},{"t":10.14,"l":"R"},{"t":12.9,"l":"A"},{"t":13.32,"l":"R"},{"t":14.42,"l":"A"},{"t":15.2,"l":"R"},{"t":17,"l":"A"},{"t":19.44,"l":"R"},{"t":20.6,"l":"A"},{"t":21.14,"l":"R"},{"t":22.52,"l":"A"},{"t":23.7,"l":"R"},{"t":27.3,"l":"A"}];
  var BLINK=0.14, audio=document.getElementById('neonAudio'), btn=document.getElementById('soundBtn'), raf=0, playing=false;
  function paint(on){btn.setAttribute('aria-pressed',String(on));btn.querySelector('use').setAttribute('href',on?'#i-sound':'#i-sound-off');btn.title=on?'Turn neon sound off':'Play neon sound'}
  function frame(){
    var t=audio.currentTime, offA=false, offR=false;
    for(var i=0;i<PEAKS.length;i++){if(t>=PEAKS[i].t&&t<PEAKS[i].t+BLINK){if(PEAKS[i].l==='A')offA=true;else offR=true}}
    document.querySelectorAll('.neon .tilt').forEach(function(g){g.style.opacity=offA?'0.12':'1'});
    document.querySelectorAll('.neon .blink').forEach(function(g){g.style.opacity=offR?'0.12':'1'});
    raf=requestAnimationFrame(frame);
  }
  function stop(){playing=false;audio.pause();cancelAnimationFrame(raf);document.body.classList.remove('sound-on');document.querySelectorAll('.neon .tilt,.neon .blink').forEach(function(g){g.style.opacity=''});paint(false)}
  btn.addEventListener('click',function(){
    if(playing){stop();return}
    btn.setAttribute('aria-busy','true');
    audio.play().then(function(){btn.removeAttribute('aria-busy');playing=true;document.body.classList.add('sound-on');paint(true);cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)})
      .catch(function(){btn.removeAttribute('aria-busy');paint(false)});
  });
})();
</script>

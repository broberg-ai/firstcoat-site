<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2")}
:root{--night:#140A1F;--white:#F6F2EC;--pink:#FF2D95;--purple:#9B3DFF;--classic:#FF3B1F}
*{box-sizing:border-box}
/* Siden står på den samme mur som bag rørene (ejeren 20/10) */
html,body{margin:0;min-height:100%;background:#080607 url(wall-tile.webp) repeat;color:var(--white);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(14px,3vh,32px);padding:clamp(56px,8vh,96px) 16px}
h1{margin:0;width:min(100%,1100px,calc((100dvh - 300px) * 2.4))}
/* Væggen bag logoet er ejerens oplyste mur; holderne ligger oven på rørene i samme viewBox */
.wall{position:relative;padding-bottom:clamp(14px,3vw,34px)}
/* Det oplyste vægstykke toner ud i muren omkring det, så der ingen kant er */
.wall::before{content:"";position:absolute;inset:0;z-index:-1;background:url(wall.webp) top left/100% auto no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 6%,#000 70%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 6%,#000 70%,transparent);mask-composite:intersect}
h1{position:relative;z-index:0}
.wall > svg{width:100%;height:auto;display:block}
.wall > svg.clips{position:absolute;top:0;left:0;pointer-events:none}
/* Bylinen er sin egen grafik og centreres selvstændigt under logoet (ejeren 21/10) */
.by{width:72%;margin:4px auto 0}
.by svg{width:100%;height:auto;display:block}
.soon{margin:0;font-weight:600;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;font-size:clamp(14px,2.2vw,26px);color:var(--classic);text-shadow:0 0 14px color-mix(in srgb,var(--classic) 70%,transparent)}
.sound{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:12px;border:1px solid color-mix(in srgb,var(--white) 18%,transparent);background:color-mix(in srgb,var(--white) 5%,transparent);color:var(--white);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.sound:hover{background:color-mix(in srgb,var(--pink) 18%,transparent)}
.sound:active{transform:scale(.94)}
.sound:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.sound[aria-pressed="true"]{color:var(--pink);border-color:var(--pink)}
.sound[aria-busy="true"]{opacity:.6;cursor:progress}
.sound svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.neon .tilt{animation:flicker 5s infinite}
.neon .blink{animation:flicker-2 7s infinite}
@keyframes flicker{0%,62%,64%,66%,100%{opacity:1}63%{opacity:.25}65%{opacity:.55}80%{opacity:.9}81%{opacity:.2}82%{opacity:1}}
@keyframes flicker-2{0%,30%,33%,100%{opacity:1}31%{opacity:.15}32%{opacity:.7}70%{opacity:1}71%{opacity:.3}73%{opacity:1}}
.sound-on .neon .tilt,.sound-on .neon .blink{animation:none}
/* «Coming soon» tænder og slukker som et neonskilt (ejeren 12/10, F002.21) */
.soon{animation:soon-glow 6s infinite}
@keyframes soon-glow{0%,40%,56%,86%,100%{opacity:1;text-shadow:0 0 6px currentColor,0 0 18px currentColor,0 0 38px currentColor}44%,47%,52%{opacity:.3;text-shadow:none}45%,50%{opacity:1;text-shadow:0 0 6px currentColor,0 0 18px currentColor,0 0 38px currentColor}88%,91%{opacity:.25;text-shadow:none}}
@media (prefers-reduced-motion:reduce){.neon .tilt,.neon .blink,.soon{animation:none}}

/* Tilmelding (F003.4) */
/* Bredt nok til lange adresser som webhouse.developer+beacon1@gmail.com (ejeren 21/10) */
.signup{width:min(100%,640px);margin:clamp(4px,1vh,12px) auto 0;text-align:center}
.signup[hidden]{display:none}
.signup-lead{margin:0 0 14px;font-size:15px;line-height:1.5;color:color-mix(in srgb,var(--white) 78%,transparent)}
.signup-row{display:flex;gap:8px}
/* Adressen lyser som neon på mørk bund (ejeren 21/10): lys kerne, rosa glød */
/* Adressen fylder feltet (ejeren 21/10: «en del større så den fylder feltet ud») */
.signup-input{flex:1;min-width:0;height:56px;padding:0 18px;border-radius:12px;border:1px solid color-mix(in srgb,var(--white) 22%,transparent);background:#000;color:#FFE3F1;caret-color:#FF5AA5;font:inherit;font-size:22px;font-weight:500;letter-spacing:.01em;text-shadow:0 0 4px #FF5AA5,0 0 10px #FF2D95,0 0 20px #E3103F;transition:border-color .15s,box-shadow .15s}
/* Browserens autoudfyldning maler ellers feltet lyseblåt og teksten sort */
.signup-input:-webkit-autofill,.signup-input:-webkit-autofill:hover,.signup-input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #000 inset;-webkit-text-fill-color:#FFE3F1;caret-color:#FF5AA5;transition:background-color 9999s}
.signup-input::placeholder{color:color-mix(in srgb,var(--white) 45%,transparent);text-shadow:none}
.signup-input:focus{outline:none;border-color:var(--classic);box-shadow:0 0 0 3px color-mix(in srgb,var(--classic) 30%,transparent)}
.signup-input[aria-invalid="true"]{border-color:var(--classic)}
.signup-btn{height:56px;padding:0 20px;border-radius:12px;border:1px solid var(--classic);background:color-mix(in srgb,var(--classic) 16%,transparent);color:var(--white);font:inherit;font-size:15px;font-weight:600;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-shadow:0 0 10px color-mix(in srgb,var(--classic) 60%,transparent);transition:background .15s,transform .1s,box-shadow .15s}
.signup-btn:hover{background:color-mix(in srgb,var(--classic) 30%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--classic) 45%,transparent)}
.signup-btn:active{transform:scale(.97)}
.signup-btn:focus-visible{outline:2px solid var(--classic);outline-offset:2px}
.signup-btn[aria-busy="true"]{opacity:.7;cursor:progress}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--white) 30%,transparent);border-top-color:var(--white);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.signup-msg{margin:10px 0 0;font-size:14px;line-height:1.5;min-height:21px}
.signup-msg.err{color:var(--classic)}
.signup-fine{margin:12px 0 0;font-size:12px;line-height:1.5;color:color-mix(in srgb,var(--white) 50%,transparent)}
.signup-done{padding:18px 20px;border-radius:14px;border:1px solid color-mix(in srgb,var(--classic) 55%,transparent);background:color-mix(in srgb,#000 50%,transparent)}
.signup-done p{margin:0;font-size:15px;line-height:1.55}
.signup-done strong{display:block;margin-bottom:4px;font-size:17px;color:var(--white)}
/* På mobil står felt og knap under hinanden; lidt mindre luft og tekst, så en lang adresse også kan ses dér */
@media (max-width:440px){.signup-row{flex-direction:column}.signup-input{flex:none;padding:0 14px;font-size:18px;letter-spacing:0}.signup-btn{justify-content:center}}
</style>

// på lydens knald: hvert billede spørger lyden hvor den er, så intet kan glide.
(function(){
  var PEAKS=[{"t":1.04,"l":"A"},{"t":1.64,"l":"R"},{"t":4.14,"l":"A"},{"t":4.72,"l":"R"},{"t":7.64,"l":"A"},{"t":8.08,"l":"R"},{"t":8.84,"l":"A"},{"t":10.14,"l":"R"},{"t":12.9,"l":"A"},{"t":13.32,"l":"R"},{"t":14.42,"l":"A"},{"t":15.2,"l":"R"},{"t":17,"l":"A"},{"t":19.44,"l":"R"},{"t":20.6,"l":"A"},{"t":21.14,"l":"R"},{"t":22.52,"l":"A"},{"t":23.7,"l":"R"},{"t":27.3,"l":"A"}];
  var BLINK=0.14, audio=document.getElementById('neonAudio'), btn=document.getElementById('soundBtn'), raf=0, playing=false;
  function paint(on){btn.setAttribute('aria-pressed',String(on));btn.querySelector('use').setAttribute('href',on?'#i-sound':'#i-sound-off');btn.title=on?'Turn neon sound off':'Play neon sound'}
  function frame(){
    var t=audio.currentTime, offA=false, offR=false;
    for(var i=0;i<PEAKS.length;i++){if(t>=PEAKS[i].t&&t<PEAKS[i].t+BLINK){if(PEAKS[i].l==='A')offA=true;else offR=true}}
    document.querySelectorAll('.neon .tilt').forEach(function(g){g.style.opacity=offA?'0.12':'1'});
    document.querySelectorAll('.neon .blink').forEach(function(g){g.style.opacity=offR?'0.12':'1'});
    raf=requestAnimationFrame(frame);
  }
  function stop(){playing=false;audio.pause();cancelAnimationFrame(raf);document.body.classList.remove('sound-on');document.querySelectorAll('.neon .tilt,.neon .blink').forEach(function(g){g.style.opacity=''});paint(false)}
  btn.addEventListener('click',function(){
    if(playing){stop();return}
    btn.setAttribute('aria-busy','true');
    audio.play().then(function(){btn.removeAttribute('aria-busy');playing=true;document.body.classList.add('sound-on');paint(true);cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)})
      .catch(function(){btn.removeAttribute('aria-busy');paint(false)});
  });
})();
</script>
